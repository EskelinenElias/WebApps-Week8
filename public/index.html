<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <script src="login.js" defer></script>
  <script src="topics.js" defer></script>
  <script src="index.js" defer></script>
</head>
<body>
  <header>
    <nav>
      <div class="nav-wrapper">
        <!-- Logo -->
        <a href="#" class="brand-logo">Topics</a>
        <ul id="nav-mobile" class="right hide-on-med-and-down">
          <!-- Link to Register Form -->
          <li><a href="register.html">Register</a></li>
          <!-- Login Form -->
          <li><form id="loginForm">
            <input type="email" id="loginEmail" name="email" required>
            <label for="loginEmail">Email</label>
            <input type="password" id="loginPassword" name="password" required>
            <label for="loginPassword">Password</label>
            <button class="btn waves-effect waves-light" type="submit">Login</button>
          </form></li>
        </ul>
      </div>
    </nav>
  </header>   
  <main>
    <div class="container">
      <!-- Topic Form -->
      <h3>Add a topic</h3>
      <div id="topicForm" class="row">
        <input type="text" id="topicTitle" name="title" required>
        <label for="topicTitle">Topic Title</label>
        <textarea id="topicText" name="content" class="materialize-textarea" required></textarea>
        <label for="topicText">Topic Content</label>
        <button id="postTopic" class="btn waves-effect waves-light" type="submit">Post Topic</button>
      </div>
      <!-- Topic Container -->
      <h3>Topics</h3>
      <div id="topics"</div>
    </div>
  </main>
</body>
</html>
